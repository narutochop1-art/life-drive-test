<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>测试后台</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:24px;background:#f5f3ef}pre{background:#fff;padding:15px}</style><h1>测试数据后台</h1><input id=t type=password placeholder="ADMIN_TOKEN"><button onclick=go()>加载</button><div id=o></div><script>async function go(){let r=await fetch('/api/admin/summary',{headers:{'x-admin-token':t.value}}),d=await r.json();o.innerHTML=r.ok?'<pre>'+JSON.stringify(d,null,2)+'</pre>':'<p>无权限</p>'}</script>
