<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生驱动力测试 · 数据后台</title><style>
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;margin:0;background:#f5f3ef;color:#191919}.wrap{max-width:1100px;margin:auto;padding:24px}.bar{display:flex;gap:10px}.bar input{flex:1;padding:12px;border:1px solid #ccc;border-radius:10px}.bar button{padding:12px 18px;border:0;border-radius:10px;background:#191919;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;border-radius:14px;padding:16px}.num{font-size:28px;font-weight:700}.muted{color:#777;font-size:13px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#fff;border-radius:14px;padding:18px;margin-top:14px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #eee}pre{white-space:pre-wrap;word-break:break-word}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
</style><div class="wrap"><h1>测试数据后台</h1><div class="bar"><input id="t" type="password" placeholder="ADMIN_TOKEN"><button onclick="go()">加载数据</button></div><div id="o"></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function go(){let r=await fetch('/api/admin/summary',{headers:{'x-admin-token':t.value},cache:'no-store'}),d=await r.json();if(!r.ok){o.innerHTML='<p>无权限或后台错误</p>';return}let m=d.metrics;o.innerHTML=`<div class="grid">${[['PV',m.pv],['UV',m.uv],['开始测试',m.starts],['完成测试',m.completes],['完成率',m.completion_rate+'%'],['分享点击',m.share_clicks],['好友完成',m.referral_completes],['已解锁',m.unlocks]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}</div><div class="grid"><div class="card"><div class="muted">分享率</div><div class="num">${m.share_rate}%</div></div><div class="card"><div class="muted">好友完成率</div><div class="num">${m.referral_completion_rate}%</div></div><div class="card"><div class="muted">解锁率</div><div class="num">${m.unlock_rate}%</div></div><div class="card"><div class="muted">邀请访问</div><div class="num">${m.referral_visits}</div></div></div><div class="cols"><div class="panel"><h2>结果组合 Top 20</h2><table><tr><th>组合</th><th>人数</th></tr>${d.combos.map(x=>`<tr><td>${esc(x.combo)}</td><td>${x.count}</td></tr>`).join('')}</table></div><div class="panel"><h2>来源</h2><table><tr><th>来源</th><th>事件数</th></tr>${d.sources.map(x=>`<tr><td>${esc(x.source)}</td><td>${x.count}</td></tr>`).join('')}</table></div></div><div class="panel"><h2>每日事件</h2><table><tr><th>日期</th><th>事件</th><th>数量</th></tr>${d.daily.map(x=>`<tr><td>${x.day}</td><td>${x.event_type}</td><td>${x.count}</td></tr>`).join('')}</table></div>`}
</script></html>
